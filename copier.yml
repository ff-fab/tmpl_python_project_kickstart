_min_copier_version: '9.11.3'
_subdirectory: 'template'
_jinja_extensions:
  - jinja2_time.TimeExtension

# Files that are generated on first `copier copy` but left untouched during
# `copier update` — i.e. initial skeleton / user-owned content.
_skip_if_exists:
  # User application code & test scaffolding
  - packages/**
  # Project documentation
  - README.md
  - CONTRIBUTING.md
  - AGENTS.md
  - docs/adr/*
min_python_version:
  type: str
  default: '3.14'
  when: false
_message_before_copy: |
  Use a modern Python runtime when invoking Copier (for example: `uvx --python 3.14 --with jinja2-time copier copy . <target>`).
  Older Python runtimes can force older Copier/questionary combinations that crash in interactive prompts.

project_name:
  type: str
  help: The name of the project.
repo_name:
  type: str
  help: The name of the GitHub repository (without owner/organization).
  default: "{{ project_name|lower|replace(' ', '-') }}"
github_org:
  type: str
  help: The GitHub organization or username that owns the repository.
author_name:
  type: str
  help: The full name of the project author.
author_email:
  type: str
  help: The email address of the project author.
gh_token:
  type: str
  help: Optional GitHub token for local development integrations.
  default: ''
  secret: true
context7_api_key:
  type: str
  help: Optional Context7 API key for local development integrations.
  default: ''
  secret: true
surge_token:
  type: bool
  help: Whether to enable documentation preview deployments on PRs (requires SURGE_TOKEN repository secret).
  default: false
module_name:
  type: str
  help: The name of the (first) Python module (package).
  default: "{{ project_name|lower|replace(' ', '_')|replace('-', '_') }}"
  validator: >-
    {% if not module_name | regex_search('^[a-zA-Z_][a-zA-Z0-9_]*$') %}
    {{ module_name }} is not a valid Python package name (must start with a letter or underscore and contain only letters, digits, and underscores)
    {% endif %}
description:
  type: str
  help: A short description of the project.
license:
  type: str
  choices: ['MIT', 'None']
  help: The software license to use.
  default: 'MIT'
codecov:
  type: bool
  help: Whether to include Codecov integration for coverage reporting.
  default: "{{ license != 'None' }}"
  when: "{{ license != 'None' }}"
coverage_threshold:
  type: int
  help: Minimum line coverage percentage to pass the quality gate (0 to disable).
  default: 80
robot_framework:
  type: bool
  help: Whether to include Robot Framework for integration testing.
  default: false
docs_style:
  type: str
  choices: ['diataxis', 'dita', 'user-journey', 'architecture', 'flat']
  help: The documentation style.
  default: 'dita'
release_please:
  type: bool
  help: Whether to include Release Please for automated releases and SemVer tagging.
  default: true
beads_prefix:
  type: str
  help: >-
    Prefix for beads issue IDs (e.g. 'cos' produces cos-a3f2).
    Convention: for multi-word names take the first letter of each word;
    for single words take the first three letters.
  default: "{%- set parts = project_name.lower().replace('-', '_').split('_') -%}{%- if parts | length > 1 -%}{%- for p in parts -%}{{ p[0] }}{%- endfor -%}{%- else -%}{{ project_name[:3] | lower }}{%- endif -%}"
  validator: >-
    {% if not beads_prefix | regex_search('^[a-z][a-z0-9_]*$') %}
    {{ beads_prefix }} is not a valid beads prefix (must start with a lowercase letter and contain only lowercase letters, digits, and underscores)
    {% endif %}
include_sbom:
  type: bool
  help: Whether to include syft SBOM generation (CycloneDX JSON) in the devcontainer and Taskfile.
  default: false
docker_publish:
  type: bool
  help: Whether to include Docker image build & publish on release (multi-arch, GHCR).
  default: false
init_git_on_copy:
  type: bool
  help: Whether to initialize a Git repository right after scaffolding.
  default: true

_tasks:
  - command:
      - '{{ _copier_python }}'
      - -c
      - |
        import subprocess
        import sys

        check = subprocess.run(
            ["git", "rev-parse", "--is-inside-work-tree"],
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )
        if check.returncode == 0:
            raise SystemExit(0)

        # Try -b first (Git ≥ 2.28), fall back for older versions
        init = subprocess.run(
            ["git", "init", "-b", "main"],
            stderr=subprocess.DEVNULL,
        )
        if init.returncode != 0:
            init = subprocess.run(["git", "init"])
            if init.returncode == 0:
                subprocess.run(["git", "checkout", "-b", "main"])

        if init.returncode == 0:
            subprocess.run(["git", "config", "user.name", "{{ author_name }}"])
            subprocess.run(["git", "config", "user.email", "{{ author_email }}"])

        raise SystemExit(init.returncode)
    when: "{{ init_git_on_copy and _copier_operation == 'copy' }}"
