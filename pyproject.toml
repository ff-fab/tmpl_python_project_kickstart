[project]
name = "tmpl-python-project-kickstart"
version = "0.1.0"
description = "Copier template for generic Python project kickstarts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# optional dependency groups
[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.1",
    "editorconfig-checker>=3.6.1",
    "pre-commit-hooks>=6.0.0",
    "codespell>=2.4.3",
    "ruff>=0.16.1",
    "ty>=0.0.65"
]

[tool.ty]

[tool.ty.src]
exclude = [".claude/**"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
# Python linting and formatting configuration
# Aligned with frontend formatting (.prettierrc.json) for consistency
target-version = "py314"
line-length = 88
exclude = [
    "**/*.jinja",
]
